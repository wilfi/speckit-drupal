# Drupal sites manifest — project-level (Spec Kit)
# Keys are logical site IDs referenced in feature specs.

default_site: default

multisite_enabled: false

sites:
  default:
    label: "[Human-readable site name]"
    description: Primary site
    drupal_site_dir: default
    docroot: web
    config_sync: config/sync
    ddev_project: "[ddev-project-name]"
    base_url: https://[project].ddev.site
    theme: "[theme_machine_name]"
    front_page: /
    primary_urls:
      - /
    roles:
      - anonymous
      - authenticated
      - administrator
    features: []

