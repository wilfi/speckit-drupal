# Default atomic Figma components keyed by figma-regions region slug.
# Merged into figma-asset-manifest.yml by sync-figma-atomic-manifest.php when a feature
# region matches. Feature figma-regions.yml atomic_components[] override these by id.
#
# Optional: set file_key to limit this catalog to one Figma file.
# file_key: YOUR_FIGMA_FILE_KEY

defaults_by_region_slug: {}

